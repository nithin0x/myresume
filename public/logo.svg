  <text x="5" y="45" font-family="monospace" font-size="38" font-weight="bold" fill="#00ff41">&gt;</text>
  
  <!-- Grouped Text: nithin0x.space -->
  <text x="40" y="45" font-size="38">
    <tspan font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="bold" fill="#e6edf3">nithin</tspan><tspan font-family="monospace" font-weight="bold" fill="#58a6ff">0x</tspan><tspan font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="normal" fill="#8b949e">.space</tspan>
  </text>
  
