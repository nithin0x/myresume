name: Sync blog and write-ups

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-content-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - name: Test content sync
        run: npm run test:sync
      - name: Sync blog and write-ups
        run: npm run sync:blog
      - name: Detect content changes
        id: changes
        run: |
          if ! git diff --quiet -- src/data/blog-posts.json; then
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate updated site
        if: steps.changes.outputs.updated == 'true'
        run: |
          npm run lint
          npm run build
          npm run typecheck
          npm run check:export
      - name: Commit and push changed content
        if: steps.changes.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git config user.name "nithin0x"
          git config user.email "157238906+nithin0x@users.noreply.github.com"
          git add src/data/blog-posts.json
          git commit -m "chore(content): sync blog posts and write-ups"
          git push
      # GITHUB_TOKEN pushes do not start the deployment's push workflow.
      - name: Request Pages deployment
        if: steps.changes.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
