name: Sync portfolio content

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      linkedin_url:
        description: 'Optional: direct URL of a LinkedIn post to feature'
        type: string
      linkedin_title:
        description: 'Post title (required when a URL is supplied)'
        type: string
      linkedin_text:
        description: 'Post text or excerpt (required when a URL is supplied)'
        type: string
      linkedin_date:
        description: 'Publication date in YYYY-MM-DD format (required with URL)'
        type: string

permissions:
  contents: read

concurrency:
  group: portfolio-content-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - name: Test content sync
        run: npm run test:sync
      - name: Sync blog and write-ups
        id: blog
        continue-on-error: true
        run: npm run sync:blog
      - name: Save supplied LinkedIn post
        if: inputs.linkedin_url != ''
        run: npm run set:linkedin
        env:
          LINKEDIN_POST_URL: ${{ inputs.linkedin_url }}
          LINKEDIN_POST_TITLE: ${{ inputs.linkedin_title }}
          LINKEDIN_POST_TEXT: ${{ inputs.linkedin_text }}
          LINKEDIN_POST_DATE: ${{ inputs.linkedin_date }}
      - name: Sync LinkedIn feed
        if: inputs.linkedin_url == ''
        id: linkedin
        continue-on-error: true
        run: npm run sync:linkedin
        env:
          LINKEDIN_FEED_URL: ${{ secrets.LINKEDIN_FEED_URL }}
      - name: Detect content changes
        id: changes
        run: |
          if ! git diff --quiet -- src/data/linkedin-post.json src/data/blog-posts.json; then
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate updated site
        if: steps.changes.outputs.updated == 'true'
        run: |
          npm run lint
          npm run build
          npm run typecheck
          npm run check:export
      - name: Commit and push changed content
        if: steps.changes.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/linkedin-post.json src/data/blog-posts.json
          git commit -m "chore(content): sync latest posts and write-ups"
          git push
      # GITHUB_TOKEN pushes do not start the deployment's push workflow.
      - name: Request Pages deployment
        if: steps.changes.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
      - name: Report unavailable sources
        if: steps.blog.outcome == 'failure' || steps.linkedin.outcome == 'failure'
        run: |
          echo 'One content source failed. Its saved content was retained; successful source updates were processed.'
          exit 1
